<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claim Your $1000 CashApp Reward</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #00D632; /* Verde oficial de Cash App */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: 400px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
        }
        .badge {
            background-color: #e6f9ed;
            color: #00D632;
            font-size: 14px;
            font-weight: bold;
            padding: 6px 16px;
            border-radius: 20px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 24px;
            color: #111;
            margin-bottom: 10px;
            line-height: 1.3;
        }
        p {
            font-size: 15px;
            color: #666;
            margin-bottom: 20px;
        }
        .img-container {
            width: 100%;
            margin-bottom: 20px;
        }
        .img-container img {
            width: 70%;
            max-width: 200px;
            height: auto;
        }
        .btn {
            display: block;
            width: 100%;
            background-color: #00D632;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            padding: 16px 0;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 214, 50, 0.4);
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:active {
            transform: scale(0.98);
            background-color: #00b32a;
        }
        .footer-note {
            font-size: 12px;
            color: #aaa;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Official Promotion</span>
        <h1>Get Your $1,000 CashApp Gift Card!</h1>
        <p>Confirm your entry below to claim your reward. Limited spots available for US residents.</p>
        
        <div class="img-container">
            <!-- Logo oficial limpio cargado desde Wikimedia (no necesitas descargar la imagen) -->
            <img src="cashapp.jpg" alt="Cash App">
        </div>

        <!-- Enlace de afiliado personal para la oferta de Cash App en Android -->
        <a href="https://singingfiles.com/show.php?l=0&u=670690&id=75221" class="btn">CLAIM $1,000 NOW</a>

        <p class="footer-note">Free entry • No purchase necessary</p>
    </div>

</body>
</html>
