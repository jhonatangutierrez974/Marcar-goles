<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Desafío de Penales!</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Fondo de Estadio a Pantalla Completa */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('Fondo.jpg') no-repeat center center / cover;
      z-index: 1;
    }

    /* Overlay Oscuro */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    /* Contenedor Principal Centrado */
    .wrapper {
      position: relative;
      z-index: 3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* Tarjeta Flotante de Cristal (Proporción exacta del boceto) */
    .card {
      background: rgba(15, 28, 22, 0.58);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 18px;
      padding: 18px 14px;
      width: 100%;
      max-width: 340px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    /* Encabezado */
    h1 {
      font-size: 19px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      white-space: nowrap;
    }

    .subtitle {
      font-size: 11px;
      color: #d1d5db;
      margin-bottom: 10px;
      line-height: 1.2;
    }

    /* Pregunta Retadora en Verde */
    .challenge-question {
      font-size: 17px;
      font-weight: 800;
      color: #4ade80;
      margin-bottom: 10px;
      line-height: 1.2;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.3);
    }

    /* Insignia Sin Registro */
    .no-register-badge {
      background: rgba(234, 179, 8, 0.2);
      border: 1px solid #eab308;
      color: #fef08a;
      font-size: 10.5px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      display: inline-block;
    }

    /* Texto previo a la imagen */
    .sub-challenge-text {
      font-size: 11.5px;
      color: #e2e8f0;
      margin-bottom: 8px;
      font-weight: 500;
    }

    /* Miniatura más pequeña y compacta como en el boceto */
    .hero-image-box {
      width: 100%;
      max-width: 170px;
      margin: 0 auto 12px auto;
      border-radius: 10px;
      overflow: hidden;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 5px 12px rgba(0,0,0,0.5);
    }

    .hero-image-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Botón CTA del Boceto */
    .btn-cta {
      display: block;
      width: 100%;
      background: #22c55e;
      color: #052e16;
      font-size: 14px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      padding: 12px 8px;
      border-radius: 10px;
      border: 2px solid #86efac;
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.6);
      cursor: pointer;
      line-height: 1.2;
      animation: attentionPulse 1.6s infinite ease-in-out;
    }

    .btn-cta:active {
      transform: scale(0.97);
      background: #16a34a;
    }

    @keyframes attentionPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 0 20px rgba(34, 197, 94, 0.9);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(34, 197, 94, 0.5);
      }
    }

    /* Pie de página */
    .footer-note {
      font-size: 9.5px;
      color: #9ca3af;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- Fondo de Estadio y Overlay -->
  <div class="bg-container"></div>
  <div class="bg-overlay"></div>

  <!-- Contenedor y Tarjeta Flotante -->
  <div class="wrapper">
    <div class="card">
      
      <h1>⚽ ¡DESAFÍO DE PENALES! ⚽</h1>
      <p class="subtitle">Demuestra tu puntería y participa por recompensas.</p>

      <div class="challenge-question">
        ¿Te crees capaz de marcarle dos goles al arquero? 🥅
      </div>

      <div class="no-register-badge">
        ⚠️ SIN REGISTRO NI CORREO. SOLO JUEGA.
      </div>

      <p class="sub-challenge-text">Acepta el reto. Solo los mejores lo logran. 👇</p>

      <!-- Miniatura Reducida -->
      <div class="hero-image-box">
        <img src="Miniatura.jpg" alt="Desafío de Goles">
      </div>

      <!-- Botón de Oferta CPA -->
      <a href="https://singingfiles.com/show.php?l=0&u=670690&id=75186" class="btn-cta" id="cta-link">
        ⚽ ACEPTAR EL RETO<br>Y JUGAR NOW
      </a>

      <p class="footer-note">Acreditación instantánea tras tus goles.</p>

    </div>
  </div>

</body>
</html>
