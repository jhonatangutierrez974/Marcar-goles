<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Desafío de Penales!</title>
  <style>
    /* Reset Completo */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Fondo de Estadio - Pantalla Completa */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('Fondo.jpg') no-repeat center center / cover;
      z-index: 1;
    }

    /* Overlay oscuro para legibilidad general */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 2;
    }

    /* Contenedor Principal */
    .wrapper {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* Tarjeta - Efecto de Cristal Ultra Transparente (Glassmorphism) */
    .card {
      background: rgba(20, 30, 25, 0.25); /* Muy transparente */
      backdrop-filter: blur(5px); /* Desenfoque suave del fondo */
      -webkit-backdrop-filter: blur(5px);
      border-radius: 20px;
      padding: 25px 15px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      /* Eliminado el borde verde grueso */
    }

    /* Estilos de Texto */
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 13px;
      color: #d1d5db;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    .challenge-question {
      font-size: 19px;
      font-weight: 800;
      color: #4ade80; /* Verde brillante */
      margin-bottom: 12px;
      line-height: 1.25;
    }

    /* Badge Sin Registro */
    .no-register-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #fef08a;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      display: inline-block;
    }

    /* Imagen Central - Integrada */
    .hero-image-box {
      width: 100%;
      max-width: 260px;
      margin: 0 auto 18px auto;
      border-radius: 12px;
      overflow: hidden;
      /* Eliminado el borde de la imagen */
    }

    .hero-image-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Botón CTA - Verde Sólido del Boceto con Animación */
    .btn-cta {
      display: block;
      width: 100%;
      background: #22c55e; /* Verde sólido */
      color: #052e16; /* Texto oscuro para contraste */
      font-size: 17px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      padding: 16px 10px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
      cursor: pointer;
      animation: pulse 1.8s infinite; /* Animación de pulso */
    }

    .btn-cta:active {
      transform: scale(0.98);
      background: #15803d;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
      }
      50% {
        transform: scale(1.03);
        box-shadow: 0 6px 20px rgba(34, 197, 94, 0.8);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
      }
    }

    /* Nota al Pie */
    .footer-note {
      font-size: 10px;
      color: #9ca3af;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- Fondo de Estadio y Overlay -->
  <div class="bg-container"></div>
  <div class="bg-overlay"></div>

  <!-- Contenido Central -->
  <div class="wrapper">
    <div class="card">
      
      <h1>⚽ ¡DESAFÍO DE PENALES! ⚽</h1>
      <p class="subtitle">Demuestra tu puntería y participa por recompensas.</p>

      <div class="challenge-question">
        ¿Te crees capaz de lograrlo?
      </div>

      <div class="no-register-badge">
        ⚠️ SIN REGISTRO NI CORREO. SOLO JUEGA.
      </div>

      <!-- Imagen Central -->
      <div class="hero-image-box">
        <img src="Miniatura.jpg" alt="Desafío de Goles">
      </div>

      <!-- Enlace a la Oferta con Botón Animado -->
      <a href="https://singingfiles.com/show.php?l=0&u=670690&id=75186" class="btn-cta" id="cta-link">
        ⚽ COMENZAR EL RETO
      </a>

      <p class="footer-note">Acreditación instantánea tras tus goles.</p>

    </div>
  </div>

</body>
</html>
