<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>¡Desafío de Penales!</title>
  <style>
    /* Estilos Generales y Reset */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      background-color: #000;
      color: #fff;
    }

    /* Fondo de Estadio con Overlay Oscuro */
    .bg-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.85)), url('Fondo.jpg') no-repeat center center / cover;
      z-index: 1;
    }

    /* Contenedor Principal */
    .wrapper {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .card {
      background: rgba(15, 25, 20, 0.78);
      border: 2px solid rgba(74, 222, 128, 0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 18px;
      padding: 20px 16px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(74, 222, 128, 0.2);
    }

    /* Textos Encabezado */
    h1 {
      font-size: 22px;
      font-weight: 900;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .subtitle {
      font-size: 13px;
      color: #d1d5db;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .challenge-question {
      font-size: 19px;
      font-weight: 800;
      color: #4ade80;
      margin-bottom: 10px;
      line-height: 1.2;
      text-shadow: 0 0 10px rgba(74, 222, 128, 0.4);
    }

    /* Banner Sin Registro */
    .no-register-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid #eab308;
      color: #fef08a;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      display: inline-block;
      letter-spacing: 0.5px;
    }

    /* Contenedor de la Imagen con integración visual */
    .hero-image-box {
      width: 100%;
      max-width: 260px;
      margin: 0 auto 14px auto;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(74, 222, 128, 0.5);
      box-shadow: 0 6px 15px rgba(0,0,0,0.6);
    }

    .hero-image-box img {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Botón Principal CTA Verde Fosforescente con Animación de Movimiento */
    .btn-cta {
      display: block;
      width: 100%;
      background: #22c55e;
      color: #052e16;
      font-size: 17px;
      font-weight: 900;
      text-decoration: none;
      text-transform: uppercase;
      padding: 15px 10px;
      border-radius: 12px;
      border: 2px solid #86efac;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.7);
      transition: transform 0.1s ease, background 0.1s ease;
      cursor: pointer;
      animation: attentionPulse 1.5s infinite ease-in-out;
    }

    .btn-cta:active {
      transform: scale(0.96);
      background: #16a34a;
    }

    @keyframes attentionPulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
      }
      50% {
        transform: scale(1.04);
        box-shadow: 0 0 25px rgba(34, 197, 94, 0.95);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
      }
    }

    /* Pie de página */
    .footer-note {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <!-- Fondo de Estadio -->
  <div class="bg-container"></div>

  <!-- Contenido Central -->
  <div class="wrapper">
    <div class="card">
      
      <h1>⚽ ¡DESAFÍO DE PENALES! ⚽</h1>
      <p class="subtitle">Demuestra tu puntería y participa por recompensas.</p>

      <div class="challenge-question">
        ¿Te crees capaz de lograrlo?
      </div>

      <div class="no-register-badge">
        ⚠️ SIN REGISTRO NI CORREO. SOLO JUEGA.
      </div>

      <!-- Imagen Miniatura (Arquero y Balón) -->
      <div class="hero-image-box">
        <img src="Miniatura.jpg" alt="Desafío de Goles">
      </div>

      <!-- Enlace a la Oferta CPA con el Botón Verde Fosforescente Animado -->
      <a href="https://singingfiles.com/show.php?l=0&u=670690&id=75186" class="btn-cta" id="cta-link">
        ⚽ COMENZAR EL RETO
      </a>

      <p class="footer-note">Acreditación instantánea tras tus goles.</p>

    </div>
  </div>

</body>
</html>
